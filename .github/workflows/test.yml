name: Plugin checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.mjs --check
      - run: node scripts/check-release.mjs
      - run: node --test tests/*.test.mjs
      - run: python3 -m py_compile tests/e2e/e2e.py
